[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipedics"
version = "0.5.0"
description = "AI-powered video clip generator & personal studio"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2024.12.0",
    "ffmpeg-python>=0.2.0",
    "faster-whisper>=1.0.0",
    "google-generativeai>=0.8.0",
    "groq>=0.5.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "celery>=5.3.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
clipedics = "main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "api*", "workers*", "config*"]

[tool.ruff]
line-length = 100
target-version = "py311"
