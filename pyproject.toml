[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "clipedics"
version = "0.1.0"
description = "AI-powered video clip generator — clone of Vizard.ai / Kixy.ai"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2024.12.0",
    "ffmpeg-python>=0.2.0",
    "whisperx>=3.3.0",
    "google-generativeai>=0.8.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "black>=24.0", "ruff>=0.4.0"]

[project.scripts]
clipedics = "main:app"

[tool.ruff]
line-length = 100
target-version = "py311"

